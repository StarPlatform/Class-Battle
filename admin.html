<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinBattle HQ | Otoritas Kontrol</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 20px; }
        .admin-container { max-width: 800px; margin: 0 auto; }
        .header-admin { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid #1e293b; }
        .header-admin h1 { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 8px; color: #3b82f6; }
        
        /* Tema Gelap Khusus Node Chat Admin */
        .chat-block { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 16px; margin-bottom: 16px; transition: all 0.2s; }
        .chat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .chat-text { color: #f1f5f9; font-size: 0.95rem; background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 10px; word-break: break-word; white-space: pre-line; }
        
        .reply-box-preview { background: #1e3a8a; border-radius: 8px; padding: 10px 14px; margin-top: 10px; border-left: 4px solid #3b82f6; margin-bottom: 10px; }
        .reply-tag { font-size: 0.75rem; font-weight: 700; color: #60a5fa; margin-bottom: 4px; display: flex; align-items: center; gap: 4px; }
        
        .chat-actions { display: flex; gap: 14px; margin-top: 12px; border-top: 1px dashed #334155; padding-top: 10px; }
        .btn { background: none; border: none; font-size: 0.85rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn-reply { color: #60a5fa; }
        .btn-delete { color: #f87171; background: none; border: none; cursor: pointer; }
        
        .form-area { display: none; flex-direction: column; gap: 8px; margin-top: 12px; background: #0f172a; padding: 10px; border-radius: 10px; border: 1px solid #475569; }
        .form-area textarea { width: 100%; min-height: 60px; background: transparent; border: none; color: white; outline: none; padding: 6px; font-size: 0.85rem; font-family: inherit; resize: vertical; }
        .form-area button { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; align-self: flex-start; }
        .form-area button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="header-admin">
        <h1><i class="fas fa-user-shield"></i> MinBattle Markas Kontrol</h1>
        <span style="font-size: 0.75rem; background: #1e3a8a; padding: 4px 12px; border-radius: 20px; color: #60a5fa; font-weight: 600;">Otoritas Penuh</span>
    </div>

    <!-- SINKRON: ID di bawah ini diganti jadi adminTimeline biar klop sama pemanggilan JS -->
    <div id="adminTimeline">
        <div style="text-align:center; padding:40px; color:#64748b;">Menghubungkan ke server Class Battle...</div>
    </div>
</div>

<!-- ======================================================= -->
<!-- FIREBASE SYSTEM ADMIN.HTML (RECEIVE & REPLY FIX) -->
<!-- ======================================================= -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCBVjPohvfPZYs8DfGtzEdi5j4Svb3UvLI",
        authDomain: "class-battle-19f8c.firebaseapp.com",
        databaseURL: "https://class-battle-19f8c-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "class-battle-19f8c",
        storageBucket: "class-battle-19f8c.firebasestorage.app",
        messagingSenderId: "586414902582",
        appId: "1:586414902582:web:1fb3398c53c8d8e8d0b797",
        measurementId: "G-ZKTK9S7LVS"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    
    // FIX: Sekarang mengarah langsung ke ID 'adminTimeline' yang ada di HTML atas!
    const container = document.getElementById("adminTimeline");

    function escapeHtml(str) {
        return str ? str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;') : '';
    }

    // =======================================================
    // 1. MONITOR PESAN MASUK SECARA REALTIME
    // =======================================================
    db.ref("chat_hub").on("value", (snapshot) => {
        if (!container) return;
        container.innerHTML = ""; 

        if (!snapshot.exists()) {
            container.innerHTML = `<div style="text-align:center; padding:40px; color:#94a3b8;"><i class="fas fa-message-slash" style="font-size:2rem; display:block; margin-bottom:8px;"></i>Belum ada saran atau kritik masuk dari user, bre.</div>`;
            return;
        }

        snapshot.forEach((childSnapshot) => {
            const key = childSnapshot.key;
            const data = childSnapshot.val();

            const block = document.createElement("div");
            block.className = "chat-block";
            
            const isReplied = data.reply && data.reply.trim() !== "";
            const statusBadge = isReplied 
                ? `<span style="background:rgba(16,185,129,0.2); color:#34d399; padding:2px 8px; border-radius:6px; font-size:0.75rem; font-weight:600;">Selesai Dibalas</span>`
                : `<span style="background:rgba(245,158,11,0.2); color:#fbbf24; padding:2px 8px; border-radius:6px; font-size:0.75rem; font-weight:600;">Menunggu Balasan</span>`;

            const senderDisplay = data.senderUID !== "ANONIM_USER" ? data.senderName : "Anonim";

            let innerHtml = `
                <div class="chat-header">
                    <div>
                        <strong style="color:#60a5fa;">@${escapeHtml(senderDisplay)}</strong> 
                        <small style="color:#94a3b8; margin-left:6px;">${escapeHtml(data.time)}</small>
                        <div style="margin-top:4px;">${statusBadge}</div>
                    </div>
                    <button class="btn btn-delete" data-id="${key}"><i class="fas fa-trash-can"></i> Hapus</button>
                </div>
                <p class="chat-text">${escapeHtml(data.message)}</p>
            `;

            if (isReplied) {
                innerHtml += `
                    <div class="reply-box-preview">
                        <div class="reply-tag"><i class="fas fa-reply"></i> Balasan Lu (MinBattle):</div>
                        <p style="color:#f1f5f9; font-size:0.9rem; font-style:italic;">"${escapeHtml(data.reply)}"</p>
                    </div>
                `;
            }

            innerHtml += `
                <div class="chat-actions">
                    <button class="btn btn-reply" data-id="${key}"><i class="fas fa-comment-dots"></i> ${isReplied ? 'Edit Balasan' : 'Balas Pesan'}</button>
                </div>
                <div class="form-area" id="box-${key}">
                    <textarea id="input-${key}" placeholder="Tulis tanggapan resmi MinBattle...">${data.reply || ''}</textarea>
                    <button class="btn-submit" data-id="${key}">Kirim Tanggapan</button>
                </div>
            `;

            block.innerHTML = innerHtml;
            container.appendChild(block);
        });

        // =======================================================
        // 2. REGISTER EVENT HANDLING TOMBOL DI PANEL ADMIN
        // =======================================================
        
        // Klik tombol balas untuk sliding/munculin form teks area
        document.querySelectorAll('.btn-reply').forEach(b => {
            b.addEventListener('click', (e) => {
                const id = e.currentTarget.dataset.id;
                const f = document.getElementById(`box-${id}`);
                if (f) f.style.display = (f.style.display === 'none' || f.style.display === '') ? 'flex' : 'none';
            });
        });

        // Kirim tanggapan balasan admin ke Firebase
        document.querySelectorAll('.btn-submit').forEach(b => {
            b.addEventListener('click', (e) => {
                const id = e.currentTarget.dataset.id;
                const replyText = document.getElementById(`input-${id}`).value.trim();
                
                if (!replyText) {
                    alert("Tulis balasannya dulu bre, jangan dikosongin!");
                    return;
                }

                db.ref(`chat_hub/${id}`).update({ reply: replyText })
                    .then(() => {
                        alert("Balasan berhasil terkirim ke user!");
                    })
                    .catch(err => alert("Gagal mengirim tanggapan: " + err.message));
            });
        });

        // Hapus pesan dari database line masa
        document.querySelectorAll('.btn-delete').forEach(b => {
            b.addEventListener('click', (e) => {
                const id = e.currentTarget.dataset.id;
                if (confirm("Hapus permanen pesan ini dari database?")) {
                    db.ref(`chat_hub/${id}`).remove()
                        .then(() => {
                            alert("Pesan terhapus.");
                        })
                        .catch(err => alert("Gagal menghapus: " + err.message));
                }
            });
        });
    });
</script>

</body>
</html>
